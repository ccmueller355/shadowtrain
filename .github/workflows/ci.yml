name: CI — Test, Lint, Format, Doctor, Secrets & Docs

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'src/**'
      - 'app/**'
      - 'scripts/**'
      - 'App.tsx'
      - 'index.ts'
      - 'eslint.config.mjs'
      - '.prettierrc'
      - 'package.json'
      - 'package-lock.json'
      - 'app.json'
      - '.gitleaks.toml'
      - '.github/workflows/ci.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Secrets, Lint, Format, Doctor, Coverage & Docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Gitleaks secrets scan
        run: |
          curl -sL "https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz" -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz
          sudo mv gitleaks /usr/local/bin/
          rm -f gitleaks.tar.gz
          gitleaks detect --source . --verbose --config .gitleaks.toml

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run ESLint
        run: npm run lint

      - name: Check code formatting (Prettier)
        run: npm run format:check

      - name: TypeScript strict check
        run: npx tsc --noEmit

      - name: Verify Expo config
        run: npx expo config --type introspect

      - name: Run Expo Doctor
        run: npx --yes expo-doctor

      - name: Run Unit & Component Tests (CT) with coverage
        run: npm run test:coverage

      - name: Build VitePress docs with coverage report
        run: npm run docs:build:full

      - name: Configure GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy-pages:
    name: Deploy Docs to GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
